# https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]

# Toolchain pinning: change only together with .github/workflows/ci.yml and docs/static-analysis.md
solc = "0.8.26"
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
# via-ir: parity with the bytecode FixedSaleV4 was verified and tested against
via_ir = true

# Deterministic metadata: reproducible bytecode across machines
bytecode_hash = "none"
cbor_metadata = false

# Required by slither/aderyn to map findings back to the source
ast = true
build_info = true
extra_output = ["storageLayout"]

# Compiler warnings are errors: static analysis starts from a clean build
deny = "warnings"
# ...but not the ones coming from the dependencies in lib/
ignored_warnings_from = ["lib"]

fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 2000

[profile.default.invariant]
runs = 1000
depth = 150
fail_on_revert = false

# CI profile: nightly campaign (nightly.yml workflow).
# Invariants inherit the default profile: 1000 runs x depth 150.
[profile.ci.fuzz]
runs = 20000

# "lite" profile: fast local builds, never use it for analysis
[profile.lite]
optimizer = false
via_ir = false
deny = "never"

[doc]
out = "docs/book"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[lint]
# forge lint runs as an informational step (`make lint`, its own CI step) and
# does not gate the build: the security gates are slither and aderyn, which
# support per-finding triage. See docs/findings.md.
lint_on_build = false
