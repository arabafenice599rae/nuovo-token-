# Aderyn - scan configuration (https://cyfrin.gitbook.io/cyfrin-docs)
# Full detector list: `aderyn registry`

# DO NOT change: only version 1 is supported for now
version = 1

# Project root: the directory holding foundry.toml
root = "."

# Sources to analyse (the production contracts)
src = "src/"

# Out of scope: dependencies, tests and deploy scripts
exclude = ["lib/", "test/", "script/"]

[detectors]
# All detectors run by default. The exclusions below are triaged one by one in
# docs/findings.md; surgical exceptions go inline in the source with
# `// aderyn-fp-next-line(<detector>)`.
exclude = [
    # Every payment is a pull to msg.sender or to feeRecipient, which is
    # immutable and checked != address(0) in the constructor.
    "eth-send-unchecked-address",
    # State writes after external calls: every entrypoint is nonReentrant and
    # `finalized` is set before the interactions (CEI). CAUTION: this exclusion
    # assumes the guard stays on EVERY external function.
    "reentrancy-state-change",
]

[env]
FOUNDRY_PROFILE = "default"
