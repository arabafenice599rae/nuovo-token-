name: Apply ruleset

# Manual only, on purpose: this workflow can change repository settings, so it
# must never be reachable from an event an outsider can trigger.
on:
  workflow_dispatch:

jobs:
  apply:
    name: Apply .github/rulesets/main.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The rulesets API needs repository administration scope, and GITHUB_TOKEN
      # cannot be granted it: `administration` is not a workflow permission key.
      # So this workflow runs on a token you provide, and says so plainly rather
      # than failing later with a bare 403.
      - name: Check the token
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RULESET_TOKEN is not set. Create a fine-grained personal access token with 'Administration: read and write' on this repository, store it as the RULESET_TOKEN secret, and run this workflow again — or apply the ruleset by hand from Settings > Rules > Rulesets."
            exit 1
          fi

      - name: Create or update the ruleset
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          id="$(gh api "repos/$repo/rulesets" --jq '.[] | select(.name=="main") | .id' 2>/dev/null || true)"
          if [ -n "$id" ]; then
            echo "Updating ruleset $id"
            gh api -X PUT "repos/$repo/rulesets/$id" \
              -H "Accept: application/vnd.github+json" \
              --input .github/rulesets/main.json > /dev/null
          else
            echo "Creating the ruleset"
            gh api -X POST "repos/$repo/rulesets" \
              -H "Accept: application/vnd.github+json" \
              --input .github/rulesets/main.json > /dev/null
          fi

      - name: Show what is live
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          id="$(gh api "repos/$repo/rulesets" --jq '.[] | select(.name=="main") | .id')"
          gh api "repos/$repo/rulesets/$id" --jq '{name, enforcement, rules: [.rules[].type]}'
          gh api "repos/$repo/rulesets/$id" \
            --jq '.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context'
