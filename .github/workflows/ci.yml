name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_VERSION: "1.8.1"
  SLITHER_VERSION: "0.11.6"
  ADERYN_VERSION: "0.6.8"

jobs:
  forge:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Submodules are initialised by `make install`: a recursive checkout
          # would also pull the nested dependencies nobody uses
          # (openzeppelin/forge-std inside v4-core, permit2, ...).
          submodules: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: |
          make install
          make deps-check

      - run: forge --version

      - name: Formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Lint (informational, does not gate)
        continue-on-error: true
        run: forge lint

      - name: Test
        run: forge test -vvv

      - name: Frontend selectors match the contract
        run: make check-selectors

  slither:
    name: Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Submodules are initialised by `make install`: a recursive checkout
          # would also pull the nested dependencies nobody uses
          # (openzeppelin/forge-std inside v4-core, permit2, ...).
          submodules: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: |
          make install
          make deps-check

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip install "slither-analyzer==${SLITHER_VERSION}" crytic-compile

      - name: Run Slither
        # The failure threshold is "fail_on": "medium" in slither.config.json
        run: slither .

  aderyn:
    name: Aderyn
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Submodules are initialised by `make install`: a recursive checkout
          # would also pull the nested dependencies nobody uses
          # (openzeppelin/forge-std inside v4-core, permit2, ...).
          submodules: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v${{ env.FOUNDRY_VERSION }}

      - name: Install dependencies
        run: |
          make install
          make deps-check

      - name: Install Aderyn
        run: |
          set -euo pipefail
          url="https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${ADERYN_VERSION}/aderyn-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSL "$url" -o /tmp/aderyn.tar.xz
          tar -xJf /tmp/aderyn.tar.xz -C /tmp
          sudo install -m 0755 /tmp/aderyn-x86_64-unknown-linux-gnu/aderyn /usr/local/bin/aderyn
          aderyn --version

      - name: Run Aderyn
        run: |
          mkdir -p reports
          aderyn --output reports/aderyn-report.md
          aderyn --output reports/aderyn-report.json
          ./tools/aderyn-gate.sh reports/aderyn-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aderyn-report
          path: reports/
          if-no-files-found: ignore
